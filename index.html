<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Us</title>

<meta name="theme-color" content="#f4f4f0">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS home-screen install. Safari ignores the manifest for most of this and
     wants its own tags; apple-touch-icon must be a PNG, never an SVG. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Us">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #f4f4f0;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #958c80;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    display: block; touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  /* Clear of the Dynamic Island when it runs full-screen from the home
     screen, and clear of nothing much in a browser tab. */
  #hud {
    position: fixed;
    left: calc(env(safe-area-inset-left) + 12px);
    top: calc(env(safe-area-inset-top) + 12px);
    padding: 6px 8px; border-radius: 4px;
    background: rgba(255,255,255,0.72);
    white-space: pre; pointer-events: none;
    font-variant-numeric: tabular-nums;
    color: #4f4840;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module" src="game.js"></script>
<script>
  /* Registered only where it can do no harm: on a real origin, or locally with
     ?sw=1. During development a cached module is an hour lost before anyone
     suspects the cache. */
  if ('serviceWorker' in navigator &&
      (!['localhost', '127.0.0.1'].includes(location.hostname) ||
       new URLSearchParams(location.search).has('sw'))) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
