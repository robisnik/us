<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Us</title>

<meta name="theme-color" content="#f4f4f0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS home-screen install. Safari ignores the manifest for most of this and
     wants its own tags; apple-touch-icon must be a PNG, never an SVG. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Us">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">

<link rel="stylesheet" href="src/app.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<!-- The pouch. Always reachable: the homestead is at the far end of the world
     and nothing she carries was any use until she had walked there. -->
<button id="pouch" type="button" aria-label="What you are carrying">
  <span id="pouch-count">0</span>
</button>

<!-- The opening. Present in the markup rather than built in JS so it paints
     on the very first frame — she should never see a bare canvas first. -->
<div id="intro" hidden>
  <div class="intro-inner">
    <h1 id="intro-title"></h1>
    <div id="intro-body"></div>
    <p class="intro-go">tap to begin</p>
  </div>
</div>
<script type="module" src="src/main.js"></script>
<script>
  /* Registered only where it can do no harm: on a real origin, or locally with
     ?sw=1. During development a cached module is an hour lost before anyone
     suspects the cache. */
  if ('serviceWorker' in navigator &&
      (!['localhost', '127.0.0.1'].includes(location.hostname) ||
       new URLSearchParams(location.search).has('sw'))) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
